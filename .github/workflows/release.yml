name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: verify release source
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          check-latest: true
          cache: true

      - name: Verify go.mod is tidy
        run: go mod tidy -diff

      - name: Verify release tag and changelog
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          set -euo pipefail
          if [[ ! "${GITHUB_REF_NAME}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Release tag must be a SemVer-like v* tag; got ${GITHUB_REF_NAME}."
            exit 1
          fi
          version="${GITHUB_REF_NAME#v}"
          grep -Fq "## [${version}]" docs/CHANGELOG.md || {
            echo "::error::docs/CHANGELOG.md has no section for ${version}."
            exit 1
          }

      - name: Verify formatting
        run: test -z "$(gofmt -l .)"

      - name: go vet
        run: go vet ./...

      - name: govulncheck
        uses: golang/govulncheck-action@032d45514ae346b1db93c04b0c90b841c370344f # v1.1.0
        with:
          repo-checkout: false
          go-version-file: go.mod
          check-latest: true
          go-package: ./...

      - name: golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.13.2

      - name: Tests and coverage gate
        run: make cover COVERAGE_MIN=90.0

  build:
    name: build (${{ matrix.goos }}/${{ matrix.goarch }})
    needs: verify
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
          - goos: windows
            goarch: amd64
          - goos: windows
            goarch: arm64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          check-latest: true
          cache: true

      - name: Resolve version
        id: ver
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          set -euo pipefail
          bin="hello"
          if [[ "${GOOS}" == "windows" ]]; then bin="hello.exe"; fi
          mkdir -p dist
          go build \
            -trimpath \
            -buildvcs=false \
            -ldflags="-s -w -X main.version=${VERSION}" \
            -o "dist/${bin}" ./cmd/hello
          cp LICENSE NOTICE dist/

          stem="hello_${VERSION}_${GOOS}_${GOARCH}"
          pushd dist >/dev/null
          if [[ "${GOOS}" == "windows" ]]; then
            zip "${stem}.zip" "${bin}" LICENSE NOTICE
            sha256sum "${stem}.zip" > "${stem}.zip.sha256"
          else
            tar -czf "${stem}.tar.gz" "${bin}" LICENSE NOTICE
            sha256sum "${stem}.tar.gz" > "${stem}.tar.gz.sha256"
          fi
          rm -f "${bin}" LICENSE NOTICE
          popd >/dev/null

      - name: Upload build artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*
          if-no-files-found: error

  release:
    name: publish release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download all artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          merge-multiple: true

      - name: Aggregate checksums
        run: |
          set -euo pipefail
          cd dist
          cat *.sha256 > checksums.txt
          rm -f *.sha256

      - name: Extract changelog section
        id: changelog
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          notes_file="$(mktemp)"
          awk -v ver="${version}" '
            index($0, "## [" ver "]") == 1 {flag=1; next}
            flag && /^## \[/ {flag=0}
            flag {print}
          ' docs/CHANGELOG.md > "${notes_file}"
          test -s "${notes_file}" || {
            echo "::error::Changelog section for ${version} is empty."
            exit 1
          }
          echo "path=${notes_file}" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          files: dist/*
          body_path: ${{ steps.changelog.outputs.path }}
          fail_on_unmatched_files: true
