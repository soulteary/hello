name: Build and Push Docker Image

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  smoke:
    name: smoke-test image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Resolve build args
        id: ver
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          fi
          echo "created=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_OUTPUT"

      - name: Build host image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: hello:smoke
          build-args: |
            VERSION=${{ steps.ver.outputs.version }}
            REVISION=${{ github.sha }}
            CREATED=${{ steps.ver.outputs.created }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify image runtime and metadata
        env:
          EXPECTED_VERSION: ${{ steps.ver.outputs.version }}
        run: |
          set -euo pipefail
          test "$(docker run --rm hello:smoke -version)" = "${EXPECTED_VERSION}"

          image_user="$(docker inspect --format '{{.Config.User}}' hello:smoke)"
          case "${image_user}" in
            ""|root|0|0:0) echo "::error::Image runs as ${image_user:-an unspecified user}."; exit 1 ;;
          esac
          test "$(docker inspect --format '{{index .Config.Labels "org.opencontainers.image.source"}}' hello:smoke)" = "https://github.com/soulteary/hello"
          test "$(docker inspect --format '{{index .Config.Labels "org.opencontainers.image.version"}}' hello:smoke)" = "${EXPECTED_VERSION}"

          container_id="$(docker run --rm -d -p 127.0.0.1::8080 hello:smoke -listen :8080)"
          trap 'docker rm -f "${container_id}" >/dev/null 2>&1 || true' EXIT
          port="$(docker inspect --format '{{(index (index .NetworkSettings.Ports "8080/tcp") 0).HostPort}}' "${container_id}")"
          base_url="http://127.0.0.1:${port}"
          for _ in $(seq 1 30); do
            if curl --fail --silent "${base_url}/healthz" >/dev/null; then break; fi
            sleep 1
          done
          test "$(curl --fail --silent "${base_url}/healthz")" = "ok"
          curl --fail --silent -H 'User-Agent: curl/8.0' \
            -H 'X-Auth-Email: secret@example.com' \
            "${base_url}/?format=text&token=secret" > response.txt
          grep -Fq 'Project: https://github.com/soulteary/hello' response.txt
          if grep -Eq 'secret@example.com|token=secret' response.txt; then
            echo "::error::Default diagnostics exposed identity or query data."
            exit 1
          fi
          curl --fail --silent "${base_url}/?format=html" > page.html
          grep -Fq 'Pause animation' page.html

  build:
    name: build multi-platform image
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    needs: smoke
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Build without publishing
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: false
          build-args: |
            VERSION=${{ github.sha }}
            REVISION=${{ github.sha }}
          cache-from: type=gha

  publish:
    name: publish multi-platform image
    if: github.event_name == 'push'
    needs: smoke
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Validate release tag
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          set -euo pipefail
          if [[ ! "${GITHUB_REF_NAME}" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-((0|[1-9][0-9]*|[0-9]*[A-Za-z-][0-9A-Za-z-]*)(\.(0|[1-9][0-9]*|[0-9]*[A-Za-z-][0-9A-Za-z-]*))*))?(\+[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$ ]]; then
            echo "::error::Release tag must be valid SemVer; got ${GITHUB_REF_NAME}."
            exit 1
          fi
          version="${GITHUB_REF_NAME#v}"
          grep -F "## [${version}] - " docs/CHANGELOG.md | grep -Eq '^## \[[^]]+\] - [0-9]{4}-[0-9]{2}-[0-9]{2}$' || {
            echo "::error::docs/CHANGELOG.md has no dated section for ${version}."
            exit 1
          }
          git merge-base --is-ancestor "${GITHUB_SHA}" origin/main || {
            echo "::error::Release tag commit is not contained in main."
            exit 1
          }

      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Login to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Login to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: |
            soulteary/hello
            ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}

      - name: Resolve build args
        id: ver
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          fi
          echo "created=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_OUTPUT"

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Build and push
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.ver.outputs.version }}
            REVISION=${{ github.sha }}
            CREATED=${{ steps.ver.outputs.created }}
          provenance: true
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Sign and verify images (keyless)
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          set -euo pipefail
          images=()
          while IFS= read -r tag; do
            [[ -n "${tag}" ]] && images+=("${tag}@${DIGEST}")
          done <<< "${TAGS}"
          cosign sign --yes "${images[@]}"
          for image in "${images[@]}"; do
            cosign verify \
              --certificate-identity-regexp '^https://github.com/soulteary/hello/.github/workflows/docker.yml@refs/(heads/main|tags/v.*)$' \
              --certificate-oidc-issuer 'https://token.actions.githubusercontent.com' \
              "${image}" >/dev/null
          done
